name: Compilar APK con Bypass

on:
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aplicar parche en ContentGate.kt
        run: |
          python3 - << 'EOF'
          target_path = "work/android/app/src/main/java/com/facefusion/mobile/ContentGate.kt"
          
          with open(target_path, "r", encoding="utf-8") as f:
              content = f.read()
          
          # Insert constants and bypass method
          bypass_helpers = """
              const val ENABLED = false
          
              private fun bypassResult() = Result(
                  verdict = Verdict.ALLOW,
                  score = 0f,
                  sampled = 0,
                  flagged = 0,
                  detail = "content gate disabled"
              )
          """
          
          content = content.replace("object ContentGate {", f"object ContentGate {{\n{bypass_helpers}", 1)
          
          # Insert early return in checkImage
          content = content.replace(
              "fun checkImage(bitmap: Bitmap): Result {",
              "fun checkImage(bitmap: Bitmap): Result {\n        if (!ENABLED) return bypassResult()"
          )
          
          # Insert early return in checkVideo
          content = content.replace(
              "fun checkVideo(file: File): Result {",
              "fun checkVideo(file: File): Result {\n        if (!ENABLED) return bypassResult()"
          )
          
          with open(target_path, "w", encoding="utf-8") as f:
              f.write(content)
          
          print("Parche aplicado con éxito.")
          EOF

      - name: Configurar permisos de ejecución para Gradle
        run: chmod +x work/android/gradlew

      - name: Compilar APK (Release / Debug)
        working-directory: work/android
        run: ./gradlew assembleDebug

      - name: Subir APK modificado a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: facefusion-mobile-modded
          path: work/android/app/build/outputs/apk/debug/*.apk
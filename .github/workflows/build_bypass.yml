name: Build FaceFusion Dev (No Content Gate)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download official release APK (for native libraries)
        run: |
          curl -L -o official.apk \
            https://github.com/AbrahamPaulJ/facefusion-mobile/releases/download/v0.9.41/facefusion-mobile-0.9.41-release.apk

      - name: Extract native libraries
        run: |
          mkdir -p prebuilt-native/arm64-v8a
          unzip -j official.apk "lib/arm64-v8a/*" -d prebuilt-native/arm64-v8a/
          ls -la prebuilt-native/arm64-v8a/

      - name: Remove ContentGate (this enables the official Dev / no-gate build)
        run: |
          rm -f work/android/app/src/main/java/com/facefusion/mobile/ContentGate.kt
          echo "ContentGate.kt deleted — this will build as FaceFusion Dev (no content gate)"

      - name: Make gradlew executable
        run: chmod +x work/android/gradlew

      - name: Build APK
        working-directory: work/android
        run: |
          ./gradlew assembleDebug \
            -PprebuiltNativeDir=$GITHUB_WORKSPACE/prebuilt-native \
            -x qnnStage

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: facefusion-dev-no-gate
          path: work/android/app/build/outputs/apk/debug/*.apk
name: Compilar APK con Bypass

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download official release APK
        run: |
          curl -L -o official.apk \
            https://github.com/AbrahamPaulJ/facefusion-mobile/releases/download/v0.9.41/facefusion-mobile-0.9.41-release.apk

      - name: Extract native libraries
        run: |
          mkdir -p prebuilt-native/arm64-v8a
          unzip -j official.apk "lib/arm64-v8a/*" -d prebuilt-native/arm64-v8a/
          echo "Extracted files:"
          ls -la prebuilt-native/arm64-v8a/

      - name: Apply ContentGate bypass patch
        run: |
          python3 - << 'EOF'
          target_path = "work/android/app/src/main/java/com/facefusion/mobile/ContentGate.kt"
          
          with open(target_path, "r", encoding="utf-8") as f:
              content = f.read()
          
          bypass_helpers = """
              const val ENABLED = false
          
              private fun bypassResult() = Result(
                  verdict = Verdict.ALLOW,
                  score = 0f,
                  sampled = 0,
                  flagged = 0,
                  detail = "content gate disabled"
              )
          """
          
          content = content.replace("object ContentGate {", f"object ContentGate {{\n{bypass_helpers}", 1)
          
          content = content.replace(
              "fun checkImage(bitmap: Bitmap): Result {",
              "fun checkImage(bitmap: Bitmap): Result {\n        if (!ENABLED) return bypassResult()"
          )
          
          content = content.replace(
              "fun checkVideo(file: File): Result {",
              "fun checkVideo(file: File): Result {\n        if (!ENABLED) return bypassResult()"
          )
          
          with open(target_path, "w", encoding="utf-8") as f:
              f.write(content)
          
          print("ContentGate patch applied successfully")
          EOF

      - name: Make gradlew executable
        run: chmod +x work/android/gradlew

      - name: Build APK with prebuilt natives
        working-directory: work/android
        run: |
          ./gradlew assembleDebug \
            -PprebuiltNativeDir=$GITHUB_WORKSPACE/prebuilt-native \
            -x qnnStage

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: facefusion-mobile-bypassed
          path: work/android/app/build/outputs/apk/debug/*.apk